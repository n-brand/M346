<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>M346 AWS Lernhilfe</title>
  <meta name="description" content="Lernhilfe und Lernjournal fuer das Modul M346 (AWS Cloud), offline nutzbar.">
  <meta name="theme-color" content="#0d1a2d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icon.svg">
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-tile">M346</div>
          <div>
            <div class="brand-title">AWS Lernhilfe</div>
            <div class="brand-sub">Modul 346 &middot; Cloud</div>
          </div>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Hell/Dunkel umschalten">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Hauptnavigation">
        <a href="#quiz" class="nav-link" data-view="quiz">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1.9-1.1 1.8M12 17h.01"/></svg>
          <span>Quiz</span>
        </a>
        <a href="#journal" class="nav-link" data-view="journal">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
          <span>Journal</span>
        </a>
        <a href="#stats" class="nav-link" data-view="stats">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Statistik</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="net-status" id="netStatus">Online</div>
        <div class="credit">Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a></div>
      </div>
    </aside>

    <main class="main">
      <!-- Quiz -->
      <section class="view" id="view-quiz" hidden>
        <h1>Multiple-Choice-Quiz</h1>
        <div id="quizSetup" class="card setup">
          <h2>Quiz starten</h2>
          <div class="field">
            <span class="label">Thema</span>
            <div class="pills" id="topicPills"></div>
          </div>
          <div class="field">
            <span class="label">Anzahl Fragen</span>
            <div class="pills" id="countPills"></div>
          </div>
          <label class="check-row"><input type="checkbox" id="optShuffle" checked> Fragen mischen</label>
          <label class="check-row"><input type="checkbox" id="optWrongOnly"> Nur Fragen, die ich zuletzt falsch hatte</label>
          <div class="actions">
            <button class="btn" id="startQuiz" type="button">Quiz starten</button>
            <span class="muted" id="poolInfo"></span>
          </div>
        </div>

        <div id="quizRun" hidden>
          <div class="progress-row">
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            <span class="muted" id="progressText"></span>
          </div>
          <article class="card question" id="questionCard"></article>
          <div class="actions">
            <button class="btn" id="checkBtn" type="button">Pruefen</button>
            <button class="btn btn-ghost" id="nextBtn" type="button" hidden>Weiter &rarr;</button>
            <button class="btn btn-ghost" id="abortBtn" type="button">Abbrechen</button>
          </div>
        </div>

        <div id="quizResult" class="card" hidden></div>
      </section>

      <!-- Journal -->
      <section class="view" id="view-journal" hidden>
        <h1>Lernjournal</h1>
        <form class="card" id="journalForm" autocomplete="off">
          <h2 id="journalFormTitle">Neuer Eintrag</h2>
          <div class="grid-2">
            <label class="field"><span class="label">Datum</span><input type="date" id="jDate" required></label>
            <label class="field"><span class="label">Titel / Thema</span><input type="text" id="jTitle" placeholder="z.B. VPC und Subnetze" required></label>
          </div>
          <label class="field"><span class="label">Was habe ich gelernt / gemacht?</span><textarea id="jLearned" rows="4" required></textarea></label>
          <label class="field"><span class="label">Probleme / offene Fragen</span><textarea id="jProblems" rows="3"></textarea></label>
          <label class="field"><span class="label">Naechste Schritte</span><textarea id="jNext" rows="2"></textarea></label>
          <div class="actions">
            <button class="btn" type="submit" id="jSave">Speichern</button>
            <button class="btn btn-ghost" type="button" id="jCancel" hidden>Bearbeiten abbrechen</button>
          </div>
        </form>

        <div class="section-head">
          <h2>Eintraege</h2>
          <div class="actions">
            <button class="btn btn-small btn-ghost" type="button" id="jCopy">Als Markdown kopieren</button>
            <button class="btn btn-small btn-ghost" type="button" id="jDownload">Markdown herunterladen</button>
          </div>
        </div>
        <p class="muted" id="journalMsg" role="status"></p>
        <div id="journalList" class="entries"></div>
      </section>

      <!-- Statistik -->
      <section class="view" id="view-stats" hidden>
        <h1>Statistik</h1>
        <div id="statsBody"></div>
      </section>

      <footer class="page-foot">
        Erstellt von <a href="https://n-brand.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Nicolas Brand</a>
      </footer>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="">
  </div>

  <script src="js/questions.js"></script>
  <script src="js/questions/kn01.js"></script>
  <script src="js/questions/kn02.js"></script>
  <script src="js/questions/kn03.js"></script>
  <script src="js/questions/kn04.js"></script>
  <script src="js/questions/kn05.js"></script>
  <script src="js/questions/kn06.js"></script>
  <script src="js/questions/kn07.js"></script>
  <script src="js/questions/kn08.js"></script>
  <script src="js/questions/kn09.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
