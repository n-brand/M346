<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrAs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrAsG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Auto Scaling: die Flotte verwaltet sich selbst</text>

  <!-- Load Balancer oben -->
  <rect x="345" y="52" width="270" height="48" rx="8" fill="#fdf3e4" stroke="#d68910" stroke-width="2"/>
  <text x="480" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a1d">Load Balancer + Health Checks</text>
  <line x1="480" y1="100" x2="480" y2="138" stroke="#444" stroke-width="2" marker-end="url(#arrAs)"/>

  <!-- Launch Template links -->
  <g>
    <rect x="45" y="200" width="185" height="130" rx="6" fill="#ffffff" stroke="#4a6785" stroke-width="2"/>
    <path d="M 195 200 v 22 h 22" fill="none" stroke="#4a6785" stroke-width="2"/>
    <text x="137" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#33475b">Launch Template</text>
    <text x="137" y="262" text-anchor="middle" font-size="12" fill="#555">die Vorlage für jede</text>
    <text x="137" y="278" text-anchor="middle" font-size="12" fill="#555">neue Instanz:</text>
    <text x="137" y="298" text-anchor="middle" font-size="12" fill="#555">Image · Typ · SG · cloud-init</text>
  </g>
  <line x1="230" y1="265" x2="292" y2="265" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrAsG)"/>
  <text x="261" y="252" text-anchor="middle" font-size="11" fill="#2e7d32">stanzt</text>
  <text x="261" y="285" text-anchor="middle" font-size="11" fill="#2e7d32">Instanzen</text>

  <!-- ASG Box -->
  <rect x="300" y="145" width="615" height="255" rx="10" fill="none" stroke="#2e8b57" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="607" y="172" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e5e3c">Auto Scaling Group — min 2 · gewünscht 2 · max 5</text>

  <!-- laufende Instanzen -->
  <rect x="330" y="195" width="130" height="85" rx="7" fill="#eefaf2" stroke="#2e8b57" stroke-width="2"/>
  <text x="395" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Instanz 1</text>
  <text x="395" y="250" text-anchor="middle" font-size="11.5" fill="#2e8b57">healthy ✓</text>

  <!-- ausgefallene Instanz -->
  <g>
    <rect x="490" y="195" width="130" height="85" rx="7" fill="#fdeeee" stroke="#b34a4a" stroke-width="2"/>
    <text x="555" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Instanz 2</text>
    <text x="555" y="250" text-anchor="middle" font-size="11.5" fill="#b34a4a">Health Check rot</text>
    <line x1="495" y1="200" x2="615" y2="275" stroke="#b34a4a" stroke-width="3.5" opacity="0.8"/>
    <line x1="615" y1="200" x2="495" y2="275" stroke="#b34a4a" stroke-width="3.5" opacity="0.8"/>
  </g>

  <!-- Ersatzinstanz -->
  <rect x="650" y="195" width="130" height="85" rx="7" fill="#eefaf2" stroke="#2e8b57" stroke-width="2"/>
  <text x="715" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Instanz 2'</text>
  <text x="715" y="250" text-anchor="middle" font-size="11.5" fill="#2e8b57">automatischer Ersatz</text>
  <line x1="620" y1="237" x2="646" y2="237" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrAsG)"/>

  <!-- leere Slots -->
  <rect x="330" y="300" width="130" height="80" rx="7" fill="none" stroke="#9ec7ae" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="395" y="345" text-anchor="middle" font-size="12" fill="#7aa98a">Platz für Instanz 4</text>
  <rect x="490" y="300" width="130" height="80" rx="7" fill="none" stroke="#9ec7ae" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="555" y="345" text-anchor="middle" font-size="12" fill="#7aa98a">Platz für Instanz 5</text>
  <text x="775" y="340" text-anchor="middle" font-size="12" fill="#7aa98a">wird nur bei Last</text>
  <text x="775" y="356" text-anchor="middle" font-size="12" fill="#7aa98a">besetzt (Kosten!)</text>

  <!-- Regeln unten -->
  <rect x="70" y="430" width="820" height="90" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  <text x="480" y="456" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333">Die Regeln (Scaling Policy)</text>
  <text x="480" y="480" text-anchor="middle" font-size="12.5" fill="#333">CPU-Durchschnitt über dem Ziel → Instanz <tspan fill="#2e7d32" font-weight="bold">hinzufügen</tspan>   ·   Last sinkt → Instanz <tspan fill="#b34a4a" font-weight="bold">entfernen</tspan>   ·   Health Check rot → Instanz <tspan fill="#2e7d32" font-weight="bold">ersetzen</tspan></text>
  <text x="480" y="504" text-anchor="middle" font-size="12.5" fill="#555">Funktioniert nur, weil jede neue Instanz sich mit cloud-init <tspan font-weight="bold">vollautomatisch</tspan> einrichtet – niemand hilft von Hand nach.</text>

  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#333">Auto Scaling = Selbstheilung + bedarfsgerechte Grösse. Das stärkste Argument für alles, was Sie über Automatisierung gelernt haben.</text>
</svg>
